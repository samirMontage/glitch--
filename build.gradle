plugins {
    id 'fabric-loom' version '1.6.12'
    id 'maven-publish'
}

version = '1.0.0'
group = 'net.glitch'

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:1.16.5"
    mappings "net.fabricmc:yarn:1.16.5+build.10:v2"
    modImplementation "net.fabricmc:fabric-loader:0.14.24"

    // Fabric API для работы горячих клавиш и ивентов
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.42.0+1.16.5"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 8
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

jar {
    from("LICENSE") {
        rename "${it}_${project.archivesBaseName}", "${it}"
    }
}
